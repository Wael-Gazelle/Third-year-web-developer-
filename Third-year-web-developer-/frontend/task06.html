<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" /> 
</head>

<body>
    <!-- Row 1 -->
    <div class="row">
        <div class="column" style="justify-content: flex-end; align-items: flex-end;">
            <div class="block"><i class="fas fa-2x fa-dog"></i></div>
        </div>

        <div class="column" style="justify-content: space-evenly; align-items: flex-end;">
            <div class="block"><i class="fas fa-2x fa-cat"></i></div>
            <div class="block"><i class="fas fa-2x fa-kiwi-bird"></i></div>
        </div>

        <div class="column" style="justify-content: space-around; align-items: flex-start;">
            <div class="block"><i class="fas fa-2x fa-cat"></i></div>
            <div class="block"><i class="fas fa-2x fa-kiwi-bird"></i></div>
        </div>

        <div class="column" style="justify-content: center; align-items: flex-start;">
            <div class="block"><i class="fas fa-2x fa-cat"></i></div>
            <div class="block"><i class="fas fa-2x fa-cat"></i></div>
        </div>
    </div>

    <!-- Row 2 -->
    <div class="row">
        <div class="column" style="justify-content: space-evenly; align-items: flex-end;">
            <div class="block"><i class="fas fa-2x fa-dog"></i></div>
            <div class="block"><i class="fas fa-2x fa-kiwi-bird"></i></div>
            <div class="block"><i class="fas fa-2x fa-cat"></i></div>
        </div>

        <div class="column" style="flex-basis: 432px; justify-content: center; align-items: center;">
            <div class="block"><i class="fas fa-2x fa-dog"></i></div>
            <div class="block"><i class="fas fa-2x fa-cat"></i></div>
        </div>

        <div class="column" style="justify-content: flex-start; align-items: flex-start;">
            <div class="block"><i class="fas fa-2x fa-dog"></i></div>
        </div>
    </div>
    <!-- Row 3 -->
    <div class="row">
        <div class="column" style="justify-content: flex-start; align-items: flex-end;">
            <div class="block"><i class="fas fa-2x fa-dog"></i></div>
        </div>

        <div class="column" style="justify-content: space-evenly; align-items: stretch;">
            <div class="block"><i class="fas fa-2x fa-dog"></i></div>
            <div class="block"><i class="fas fa-2x fa-cat"></i></div>
        </div>

        <div class="column" style=" display: flex; justify-content: space-evenly;flex-direction: column; align-items: stretch; ">
            <div class="block"style="flex-grow: 1"><i class="fas fa-2x fa-cat"></i></div>
            <div class="block"style="flex-grow: 1"><i class="fas fa-2x fa-kiwi-bird"></i></div>
            <div class="block"style="flex-grow: 1"><i class="fas fa-2x fa-cat"></i></div>
        </div>

        <div class="column" style="justify-content: space-evenly; align-items: stretch;">
            <div class="block"><i class="fas fa-2x fa-cat"></i></div>
            <div class="block"><i class="fas fa-2x fa-kiwi-bird"></i></div>
        </div>
    </div>

    <style>
        .row {
            display: flex;
        }

        .column {
            display: flex;
            flex-direction: column;
            flex-basis: 200px;
            height: 200px;
            margin: 0.5em;
            padding: 0.5em;
            background-color: gold;
        }

        .block {
            border: 2px solid black;
            margin: 0.25em;
            padding: 0.5em;
        }
    </style>

</body>

</html>
